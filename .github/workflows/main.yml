name: Build Android APK via PWABuilder

on:
  workflow_dispatch:
    inputs:
      github_username:
        description: 'GitHub username (no @)'
        required: true
        default: 'yadgari-commits'
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        default: 'civil-master-pro'
        type: string

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Wait for PWA to be live
        env:
          GH_USER: ${{ inputs.github_username }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          PWA_URL="https://${GH_USER}.github.io/${REPO_NAME}"
          echo "🌐 PWA URL: $PWA_URL"

          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PWA_URL/index.html" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ PWA is live (attempt $i, HTTP 200)"
              exit 0
            fi
            echo "⏳ Attempt $i/12: HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done

          echo "::error::PWA not reachable at $PWA_URL after 60s"
          exit 1

      - name: 🏗️ Build APK with PWABuilder
        env:
          GH_USER: ${{ inputs.github_username }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          set -e
          PWA_URL="https://${GH_USER}.github.io/${REPO_NAME}"
          echo "🌐 Building APK from: $PWA_URL"
          
          # Build payload
          PAYLOAD=$(cat <<EOF
{
  "name": "Civil Master Pro",
  "shortName": "سیویل مستر",
  "id": "${PWA_URL}",
  "packageId": "com.yadgari.civilmasterpro",
  "version": "4.0.0",
  "versionCode": 40,
  "display": "standalone",
  "themeColor": "#fbbf24",
  "backgroundColor": "#0f172a",
  "iconUrl": "${PWA_URL}/icons/icon-512.png",
  "startUrl": "/?source=pwa",
  "webManifestUrl": "${PWA_URL}/manifest.json"
}
EOF
)
          
          echo "=== Calling PWABuilder API ==="
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" -X POST \
            "https://api.pwabuilder.com/v3/build/android" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          echo "HTTP Status: $HTTP_CODE"
          echo "=== API Response ==="
          cat "$RESPONSE_FILE"
          echo ""
          echo "=== End Response ==="
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::PWABuilder API returned HTTP $HTTP_CODE"
            exit 1
          fi
          
          # Try to extract APK URL
          APK_URL=$(jq -r '
            .downloads.apk // 
            .downloads.apkBundle //
            .artifactId //
            .url // 
            .data.downloads.apk //
            .data.url //
            empty
          ' "$RESPONSE_FILE" 2>/dev/null)
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::Could not find APK URL in response"
            exit 1
          fi
          
          echo "=== Downloading APK from: $APK_URL ==="
          curl -L -s -o civil-master-pro.apk "$APK_URL"
          
          if [ ! -f "civil-master-pro.apk" ] || [ ! -s "civil-master-pro.apk" ]; then
            echo "::error::APK file is empty or missing"
            exit 1
          fi
          
          echo "✅ APK downloaded: $(du -h civil-master-pro.apk | cut -f1)"
          ls -la *.apk

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: civil-master-pro-apk
          path: |
            *.apk
          if-no-files-found: error
          retention-days: 30

      - name: ✅ Build summary
        if: success()
        run: |
          {
            echo "## 🎉 APK Build Successful!"
            echo ""
            echo "**APK files:**"
            for f in *.apk; do
              [ -f "$f" ] && echo "- \`$f\` ($(du -h "$f" | cut -f1))"
            done
            echo ""
            echo "**Install on Android:**"
            echo "1. Download the APK from Artifacts below"
            echo "2. Transfer to your phone"
            echo "3. Settings → Security → Enable \"Unknown sources\""
            echo "4. Open the APK and tap Install"
          } >> $GITHUB_STEP_SUMMARY
