name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      github_username:
        description: 'GitHub username (no @)'
        required: true
        default: 'yadgari-commits'
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        default: 'civil-master-pro'
        type: string
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 🔍 Wait for PWA to be live
        env:
          GH_USER: ${{ inputs.github_username }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          PWA_URL="https://${GH_USER}.github.io/${REPO_NAME}"
          echo "🌐 PWA URL: $PWA_URL"
          
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PWA_URL/index.html" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ PWA is live (attempt $i, HTTP 200)"
              break
            fi
            echo "⏳ Attempt $i/12: HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PWA not reachable at $PWA_URL after 60s"
            exit 1
          fi

      - name: 🏗️ Build TWA APK
        env:
          GH_USER: ${{ inputs.github_username }}
          REPO_NAME: ${{ inputs.repo_name }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          PWA_URL="https://${GH_USER}.github.io/${REPO_NAME}"
          
          rm -rf android-app
          
          bubblewrap init \
            --manifest="${PWA_URL}/manifest.json" \
            --directory=android-app || true
          
          if [ -d "android-app" ]; then
            cp twa-manifest.json android-app/twa-manifest.json
            cd android-app
            bubblewrap update --manifest="${PWA_URL}/manifest.json" || true
            
            if [ "$BUILD_TYPE" = "release" ]; then
              bubblewrap build
              for apk in app-release-signed.apk app-release.apk app-release-unsigned.apk; do
                if [ -f "$apk" ]; then
                  cp "$apk" "../civil-master-pro-$apk"
                fi
              done
            else
              bubblewrap build --skipPwaValidation
              [ -f "app-debug.apk" ] && cp app-debug.apk ../civil-master-pro-debug.apk
            fi
            cd ..
          fi

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civil-master-pro-apk
          path: |
            *.apk
          if-no-files-found: error
          retention-days: 30

      - name: ✅ Build summary
        if: success()
        run: |
          {
            echo "## 🎉 APK Build Successful!"
            echo ""
            echo "**APK files:**"
            for f in *.apk; do
              [ -f "$f" ] && echo "- \`$f\` ($(du -h "$f" | cut -f1))"
            done
          } >> $GITHUB_STEP_SUMMARY
