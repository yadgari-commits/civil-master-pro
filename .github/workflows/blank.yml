name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      github_username:
        description: 'GitHub username (no @)'
        required: true
        default: 'yadgari-commits'
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        default: 'civil-master-pro'
        type: string
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 🔍 Verify Java
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          ls -la "$JAVA_HOME/bin/javac" 2>&1 || echo "javac missing"

      - name: 🔍 Wait for PWA to be live
        env:
          GH_USER: ${{ inputs.github_username }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          PWA_URL="https://${GH_USER}.github.io/${REPO_NAME}"
          echo "🌐 PWA URL: $PWA_URL"

          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PWA_URL/index.html" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ PWA is live (attempt $i, HTTP 200)"
              break
            fi
            echo "⏳ Attempt $i/12: HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PWA not reachable at $PWA_URL after 60s"
            exit 1
          fi

      - name: 🏗️ Build TWA APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
          GH_USER: ${{ inputs.github_username }}
          REPO_NAME: ${{ inputs.repo_name }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"

          PWA_URL="https://${GH_USER}.github.io/${REPO_NAME}"
          echo "🌐 Building from: $PWA_URL"
          echo "🔧 JAVA_HOME: $JAVA_HOME"

          java -version
          javac -version

          rm -rf android-app
          mkdir -p android-app
          cd android-app

          echo "=== Step 1/3: Initializing TWA project ==="
          bubblewrap init \
            --manifest="${PWA_URL}/manifest.json" \
            --packageId="com.yadgari.civilmasterpro" \
            --jdk="$JAVA_HOME" \
            --directory=.

          echo "=== Step 2/3: Building APK ==="
          bubblewrap build --skipPwaValidation

          echo "=== Step 3/3: Copying APKs ==="
          cd ..
          FOUND=0
          for apk in android-app/app-release-signed.apk \
                     android-app/app-release.apk \
                     android-app/app-release-unsigned.apk \
                     android-app/app-debug.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "civil-master-pro-$(basename $apk)"
              echo "✅ Built: $(basename $apk) ($(du -h "$apk" | cut -f1))"
              FOUND=1
            fi
          done

          if [ "$FOUND" = "0" ]; then
            echo "::error::No APK files were produced!"
            ls -la android-app/ 2>&1 || true
            find android-app -name "*.apk" 2>&1 || echo "No APKs found"
            exit 1
          fi

          echo ""
          echo "=== Final APK files ==="
          ls -la *.apk

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civil-master-pro-apk
          path: |
            *.apk
          if-no-files-found: error
          retention-days: 30

      - name: ✅ Build summary
        if: success()
        run: |
          {
            echo "## 🎉 APK Build Successful!"
            echo ""
            echo "**APK files:**"
            for f in *.apk; do
              [ -f "$f" ] && echo "- \`$f\` ($(du -h "$f" | cut -f1))"
            done
            echo ""
            echo "**Install on Android:**"
            echo "1. Download the APK from Artifacts below"
            echo "2. Transfer to your phone"
            echo "3. Settings → Security → Enable \"Unknown sources\""
            echo "4. Open the APK and tap Install"
          } >> $GITHUB_STEP_SUMMARY
